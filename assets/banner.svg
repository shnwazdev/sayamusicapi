<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a102f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6821f" />
      <stop offset="50%" stop-color="#fa5252" />
      <stop offset="100%" stop-color="#7950f2" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="416" x="2" y="2" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Soundwave / Equalizer Animation Simulation -->
  <g transform="translate(680, 100)" opacity="0.85">
    <rect x="0" y="80" width="8" height="60" rx="4" fill="#f6821f">
      <animate attributeName="height" values="60;140;40;100;60" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="80;40;90;60;80" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="50" width="8" height="100" rx="4" fill="#fa5252">
      <animate attributeName="height" values="100;40;160;70;100" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="50;80;20;65;50" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="36" y="30" width="8" height="140" rx="4" fill="#f76707">
      <animate attributeName="height" values="140;90;50;130;140" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;55;75;35;30" dur="2.6s" repeatCount="indefinite" />
    </rect>
    <rect x="54" y="60" width="8" height="90" rx="4" fill="#e64980">
      <animate attributeName="height" values="90;150;70;40;90" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="60;30;70;85;60" dur="2.3s" repeatCount="indefinite" />
    </rect>
    <rect x="72" y="20" width="8" height="160" rx="4" fill="#be4bdb">
      <animate attributeName="height" values="160;60;120;170;160" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;70;40;15;20" dur="2.8s" repeatCount="indefinite" />
    </rect>
    <rect x="90" y="40" width="8" height="120" rx="4" fill="#7950f2">
      <animate attributeName="height" values="120;170;60;100;120" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="40;15;70;50;40" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <rect x="108" y="70" width="8" height="80" rx="4" fill="#4c6ef5">
      <animate attributeName="height" values="80;40;130;70;80" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="70;90;45;75;70" dur="2.5s" repeatCount="indefinite" />
    </rect>
    <rect x="126" y="30" width="8" height="140" rx="4" fill="#22b8cf">
      <animate attributeName="height" values="140;80;160;50;140" dur="2.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;60;20;75;30" dur="2.0s" repeatCount="indefinite" />
    </rect>
    <rect x="144" y="55" width="8" height="100" rx="4" fill="#20c997">
      <animate attributeName="height" values="100;140;40;110;100" dur="2.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="55;35;85;50;55" dur="2.7s" repeatCount="indefinite" />
    </rect>
    <rect x="162" y="75" width="8" height="70" rx="4" fill="#12b886">
      <animate attributeName="height" values="70;110;150;40;70" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="75;55;35;90;75" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <rect x="180" y="45" width="8" height="115" rx="4" fill="#40c057">
      <animate attributeName="height" values="115;50;90;140;115" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="45;78;58;33;45" dur="2.3s" repeatCount="indefinite" />
    </rect>
    <rect x="198" y="65" width="8" height="85" rx="4" fill="#82c91e">
      <animate attributeName="height" values="85;130;60;40;85" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="65;42;77;88;65" dur="2.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Glow effect behind logo -->
  <circle cx="160" cy="180" r="90" fill="#f6821f" opacity="0.12" filter="url(#glow)" />
  <circle cx="280" cy="190" r="110" fill="#7950f2" opacity="0.12" filter="url(#glow)" />

  <!-- Logo Icon -->
  <g transform="translate(80, 105)">
    <!-- Vinyl record disk -->
    <circle cx="65" cy="65" r="55" fill="#182035" stroke="#f6821f" stroke-width="3" />
    <circle cx="65" cy="65" r="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="65" cy="65" r="30" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <circle cx="65" cy="65" r="18" fill="url(#accentGrad)" />
    <circle cx="65" cy="65" r="5" fill="#ffffff" />

    <!-- Musical Note Floating -->
    <path d="M125 15 L150 5 L150 45 A12 12 0 1 1 138 35 L138 22 L125 26 Z" fill="#fa5252" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Typography -->
  <g transform="translate(260, 120)">
    <!-- Pill: Status -->
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="0.5">100% FREE API</text>
    </g>

    <g transform="translate(140, 0)">
      <rect width="170" height="26" rx="13" fill="rgba(246, 130, 31, 0.15)" stroke="#f6821f" stroke-width="1" />
      <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f6821f" letter-spacing="0.5">1,300+ ENDPOINTS</text>
    </g>

    <g transform="translate(320, 0)">
      <rect width="165" height="26" rx="13" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1" />
      <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="0.5">ZERO API QUOTAS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Saya<tspan fill="url(#accentGrad)">Music</tspan>API
    </text>

    <!-- Tagline -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Open Music Metadata, Previews, Smart Links &amp; Public Streams on Cloudflare Workers
    </text>

    <!-- Subdomain URL Pill -->
    <g transform="translate(0, 135)">
      <rect width="360" height="38" rx="8" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="18" y="24" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace" font-size="14" font-weight="600" fill="#38bdf8">
        https://saya.shnwaz.pro
      </text>
    </g>
  </g>

  <!-- Provider Badges Footer -->
  <g transform="translate(80, 345)">
    <g transform="translate(0, 0)">
      <rect width="105" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="52" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Apple/iTunes</text>
    </g>
    <g transform="translate(115, 0)">
      <rect width="105" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="52" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">JioSaavn</text>
    </g>
    <g transform="translate(230, 0)">
      <rect width="105" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="52" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">MusicBrainz</text>
    </g>
    <g transform="translate(345, 0)">
      <rect width="90" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="45" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Audius</text>
    </g>
    <g transform="translate(445, 0)">
      <rect width="90" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="45" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Deezer</text>
    </g>
    <g transform="translate(545, 0)">
      <rect width="115" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="57" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Radio Browser</text>
    </g>
    <g transform="translate(670, 0)">
      <rect width="125" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="62" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Internet Archive</text>
    </g>
    <g transform="translate(805, 0)">
      <rect width="100" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="50" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Openverse</text>
    </g>
    <g transform="translate(915, 0)">
      <rect width="120" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
      <text x="60" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Songlink/Odesli</text>
    </g>
  </g>
</svg>
